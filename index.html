<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOM Dropper</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
  <!-- Geliştirici Test Paneli -->
  <div id="test-panel">
    <h3>TEST PANELİ</h3>
    <button id="btn-add-lobby">Lobiye 5 Kişi Ekle</button>
    <button id="btn-force-drop">Toplu Atlat!</button>
    <button id="btn-simulate-cut">Rastgele İp Kes (!kes)</button>
    <button id="btn-clear-all">Temizle (Reset)</button>
  </div>

  <div id="viewport"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pusher/8.3.0/pusher.min.js"></script>
  <script type="text/javascript" src="config.js"></script>
  <script type="text/javascript" src="code.js"></script>
  <script type="text/javascript">
    // Dinamik Test Paneli Gizleme (OBS veya HTTP modlarında kaldırılır, local file:// veya ?test=true modunda görünür)
    const urlParams = new URLSearchParams(window.location.search);
    const showTest = urlParams.get('test') === 'true';
    const isLocal = window.location.protocol === 'file:';
    const testPanel = document.getElementById('test-panel');
    if (!showTest && !isLocal && testPanel) {
      testPanel.remove();
    }

    // Kick Kanal Bilgileri
    const CHANNEL_NAME = 'beryybob'; // Buraya kendi kanal adınızı yazın
    const COMMAND_DROP = '!atla';
    const COMMAND_CUT = '!kes';
    const COMMAND_LOBBY = '!topluatla'; // Yeni Battle Royale başlatma komutu
    const PUSHER_KEY = '32cbd69e4b950bf97679';
    const PUSHER_CLUSTER = 'us2';
    const BOTS = new Set(['botrix', 'kickbot', 'livadbot', 'algochat']);

    async function connectKick() {
      try {
        const res = await fetch(`https://kick.com/api/v1/channels/${CHANNEL_NAME}`);
        if (!res.ok) throw new Error('Kanal bulunamadı: ' + CHANNEL_NAME);
        const data = await res.json();
        const chatroomId = data.chatroom?.id;
        if (!chatroomId) throw new Error('Chatroom ID yok');

        const pusher = new Pusher(PUSHER_KEY, {
          cluster: PUSHER_CLUSTER, forceTLS: true,
          enabledTransports: ['ws', 'wss']
        });

        const ch = pusher.subscribe(`chatrooms.${chatroomId}.v2`);
        console.log("Kick bağlantısı başarılı: " + CHANNEL_NAME);

        ch.bind('App\\Events\\ChatMessageEvent', msg => {
          const user = msg.sender?.username;
          const text = msg.content?.trim().toLowerCase();
          if (!user || !text) return;
          if (BOTS.has(user.toLowerCase())) return;

          if (text.startsWith(COMMAND_LOBBY)) {
            if (!engine.lobbyActive) {
              engine.startLobby();
            }
          } else if (text.startsWith(COMMAND_DROP)) {
            engine.drop(user);
          } else if (text === COMMAND_CUT) {
            engine.cut(user);
          }
        });

      } catch (e) {
        console.error('Kick bağlantı hatası:', e.message);
      }
    }

    connectKick();

    // Developer Test Panel Olay Dinleyicileri
    const testNames = ["beryybob", "kilerh47", "chat_user", "paraşütçü", "atlayıcı", "uçan_emoji", "skydiver", "ninja", "gamer", "dropper"];
    
    document.getElementById('btn-add-lobby').addEventListener('click', () => {
      // Lobiye rastgele 5 kişi ekle
      for (let i = 0; i < 5; i++) {
        const name = testNames[Math.floor(Math.random() * testNames.length)] + "_" + Math.floor(Math.random() * 100);
        engine.drop(name);
      }
    });

    document.getElementById('btn-force-drop').addEventListener('click', () => {
      if (engine.lobbyActive) {
        engine.startSimultaneousDrop();
      }
    });

    document.getElementById('btn-simulate-cut').addEventListener('click', () => {
      // Aktif atlayanlardan birini bulup ipini kes
      const activeDroppers = engine.sprites.filter(s => s instanceof ParachuteDropper && !s.landed && !s.cutRequested);
      if (activeDroppers.length > 0) {
        const randomDropper = activeDroppers[Math.floor(Math.random() * activeDroppers.length)];
        engine.cut(randomDropper.name);
      }
    });

    document.getElementById('btn-clear-all').addEventListener('click', () => {
      engine.stopRenderLoop();
    });
  </script>
</body>

</html>
